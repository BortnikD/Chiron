name: chiron-demo

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiron_demo
      POSTGRES_PASSWORD: demo_database_password
      POSTGRES_DB: chiron_demo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiron_demo -d chiron_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: chiron-media
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_SECRET_KEY: demo-only-storage-secret-not-for-production
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3905:3900"
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ../chiron
    restart: unless-stopped
    environment:
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_PUBLIC_ENDPOINT: ${DEMO_STORAGE_PUBLIC_ENDPOINT:-http://localhost:3905}
      STORAGE_BUCKET: chiron-media
      STORAGE_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      STORAGE_SECRET_KEY: demo-only-storage-secret-not-for-production
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chiron_demo
      SPRING_DATASOURCE_USERNAME: chiron_demo
      SPRING_DATASOURCE_PASSWORD: demo_database_password
      JWT_SECRET: ZGVtby1vbmx5LXNlY3JldC1mb3ItY2hpcm9uLW5vdC1mb3ItcHJvZHVjdGlvbi0wMTIzNDU2Nzg5YWJjZGVm
      ADMIN_EMAIL: admin@demo.chiron.local
      ADMIN_PASSWORD: demoAdmin123
      ADMIN_PHONE: "+70000000000"
      ADMIN_FIRST_NAME: Demo
      ADMIN_LAST_NAME: Admin
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      garage:
        condition: service_healthy
      postgres:
        condition: service_healthy

  seed:
    image: postgres:18-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: chiron_demo
      PGPASSWORD: demo_database_password
      PGDATABASE: chiron_demo
    volumes:
      - ../chiron/scripts:/seed:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed-demo.sql"]
    depends_on:
      backend:
        condition: service_healthy

  seed-media:
    image: python:3.13-alpine
    restart: "no"
    environment:
      BACKEND_URL: http://backend:8080
      STORAGE_INTERNAL_ADDRESS: garage:3900
    volumes:
      - ../chiron/scripts:/seed:ro
      - photo_seed_state:/state
    command: ["python", "-u", "/seed/seed-media.py"]
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  photo_seed_state:
