name: chiron

services:
  postgres:
    image: postgres:18-alpine
    container_name: chiron-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.5.0
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${STORAGE_BUCKET:-chiron-media}
      GARAGE_DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${STORAGE_SECRET_KEY:-demo-only-storage-secret-not-for-production}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900"
    healthcheck:
      test: ["CMD", "/garage", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ../chiron
    container_name: chiron-backend
    restart: unless-stopped
    # JWT_SECRET, ADMIN_* and POSTGRES_* are passed to the app from .env as-is.
    env_file:
      - ../.env
    environment:
      # Inside the compose network the database is reachable by service name, not localhost.
      STORAGE_ENDPOINT: http://garage:3900
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:3900}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-chiron-media}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-GK0123456789abcdef0123456789abcdef}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-demo-only-storage-secret-not-for-production}
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    healthcheck:
      # busybox wget ships with the alpine runtime image; readiness goes DOWN until the app can serve traffic.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      garage:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../web-ui
      args:
        NEXT_PUBLIC_API_PROXY_TARGET: http://localhost:8080
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8080
      MEDIA_PROXY_TARGET: http://garage:3900
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  garage_meta:
  garage_data:
