spring:
  application:
    name: chiron
  datasource:
    url: jdbc:postgresql://localhost:5432/chiron
    username: postgres
    password: postgres

clinic:
  zone: Europe/Moscow
  slot-step-min: 15

jwt:
  secret: ${JWT_SECRET}
  ttl: 30d

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  phone: ${ADMIN_PHONE}
  first-name: ${ADMIN_FIRST_NAME:Admin}
  last-name: ${ADMIN_LAST_NAME:Admin}

springdoc:
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

cors:
  allowed-origins:
    # React (Vite)
    - http://localhost:5173
    # Next.js
    - http://localhost:3000
