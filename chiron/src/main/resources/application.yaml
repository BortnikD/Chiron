spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: chiron

clinic:
  zone: Europe/Moscow
  slot-step-min: 15

notification:
  reminder:
    # Pending and confirmed appointments starting within this time get a reminder for the owner.
    lead-time: 24h
    # How often the scheduler looks for appointments that entered the reminder window.
    check-interval: 5m
  vaccination-due:
    # Vaccinations whose next due date is within this many days get a reminder for the owner.
    lead-days: 7
    # Daily at 09:00 in the clinic time zone.
    cron: "0 0 9 * * *"

jwt:
  secret: ${JWT_SECRET}
  ttl: 30d

admin:
  email: ${ADMIN_EMAIL}
  password: ${ADMIN_PASSWORD}
  phone: ${ADMIN_PHONE}
  first-name: ${ADMIN_FIRST_NAME:Admin}
  last-name: ${ADMIN_LAST_NAME:Admin}

management:
  endpoints:
    web:
      exposure:
        # Only the health check is published; everything else in actuator stays off the web.
        include: health
  endpoint:
    health:
      # Public endpoint: status only, no component details (DB version, disk space, etc.).
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
            - photoStorage

springdoc:
  show-actuator: true
  default-produces-media-type: application/json
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    # springdoc 3.1.0 fails to clone the item schema of collection query parameters (Set<AppointmentStatus>)
    # and logs a harmless WARN on every /v3/api-docs build; the original schema is used as a fallback.
    org.springdoc.core.utils.SpringDocUtils: error

cors:
  allowed-origins: [ ]

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:3900}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:3900}
  region: ${STORAGE_REGION:garage}
  bucket: ${STORAGE_BUCKET:chiron-media}
  access-key: ${STORAGE_ACCESS_KEY}
  secret-key: ${STORAGE_SECRET_KEY}
  read-url-ttl: 15m
